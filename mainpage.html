<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bubblerights's strawpage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 40px 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .emoji-section {
            font-size: 28px;
            line-height: 2;
            margin-bottom: 30px;
            color: #333;
            word-break: break-word;
        }

        .emoji-section span {
            display: inline-block;
            margin: 5px;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-top: 20px;
            font-weight: 600;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s ease;
            font-weight: 500;
        }

        a:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji-section">
            <span>🎲</span><br>
            <span>*🐭* squeak *⏩* speed *👄* mouth *🫁* throat</span><br>
            <span>*🐿️* chipmunk *🎵* melody *🎢* bounce</span><br>
            <span>〰️ wobble *🔊* echo *✨* clarity</span>
        </div>

        <h1>Make your own StrawPage!</h1>
        <a href="https://straw.page" target="_blank">Create Your StrawPage</a>
    </div>
</body>
</html>
